python3 - << 'EOF'
import urllib.request
import json

packages = [
    "attrs==24.2.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "idna==3.10",
    "iniconfig==2.0.0",
    "jsonschema==4.23.0",
    "jsonschema-specifications==2023.12.1",
    "packaging==24.1",
    "pluggy==1.5.0",
    "pytest==8.3.3",
    "referencing==0.35.1",
    "requests==2.32.3",
    "rpds-py==0.20.0",
    "urllib3==2.2.3"
]

entries = []
print("正在向 PyPI 查詢全平台官方 Wheel 雜湊...")

for item in packages:
    name, ver = item.split("==")
    url = f"https://pypi.org/pypi/{name}/{ver}/json"
    req = urllib.request.Request(url, headers={"User-Agent": "veracity-ci-resolver"})
    try:
        with urllib.request.urlopen(req) as resp:
            data = json.loads(resp.read().decode("utf-8"))
        hashes = sorted({f["digests"]["sha256"] for f in data["urls"]})
        hash_lines = " \\\n".join(f"    --hash=sha256:{h}" for h in hashes)
        entries.append(f"{name}=={ver} \\\n{hash_lines}")
        print(f"  ✓ {name}=={ver} (收錄 {len(hashes)} 個發布檔雜湊)")
    except Exception as e:
        print(f"  ✗ {name} 失敗: {e}")

with open("requirements.lock", "w", encoding="utf-8") as f:
    f.write("\n".join(entries) + "\n")

print("\n✅ requirements.lock 覆寫完成（已包含 Python 3.11 Linux 的所有二進位雜湊）。")
EOF
