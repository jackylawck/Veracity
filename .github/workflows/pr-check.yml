name: PR Verification & Security Gatekeeper

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.in'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in

      - name: Run Hermetic Unit & Integration Tests
        run: python -m pytest tests/

      - name: Dry-Run Ingestion Pipeline
        run: python -m scripts.ingest --dry-run

      - name: Validate Ledger Against Schema (Gatekeeper)
        run: make check-schema

      - name: Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
