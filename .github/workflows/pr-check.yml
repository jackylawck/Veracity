name: PR Verification & Security Gatekeeper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Setup Node.js Runtime (Contract Syntax Verifier)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pinned Dependencies (Zero-Tolerance Verification)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run Hermetic Unit & Contract Tests
        run: pytest tests/

      - name: Dry-Run Ingestion Pipeline
        run: python -m scripts.ingest --dry-run

      - name: Validate Ledger Against Schema (Gatekeeper)
        run: python scripts/verify_ledger.py

      - name: Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
