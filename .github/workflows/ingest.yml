name: Veracity Autonomous Ingestion & Keyless Signature

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  ingest-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock || pip install -r requirements.in

      - name: Run Unit Tests
        run: pytest tests/

      - name: Execute Autonomous Ingestion
        run: python scripts/ingest.py

      - name: Verify Ledger Schema Output
        run: |
          python -c 'import json; data = json.load(open("public/api/records-latest.json", encoding="utf-8")); assert "records" in data and len(data["records"]) > 0; print(f"Ledger integrity verified: {len(data["records"])} dossiers active.)"'
      - name: Setup Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Keyless Cryptographic Signing
        run: |
          cosign sign-blob --yes \
            --bundle public/api/records-latest.json.bundle \
            public/api/records-latest.json

      - name: Non-blocking Wayback Archive Snapshot
        continue-on-error: true
        run: |
          curl -s -X POST "https://web.archive.org/save/https://jackylawck.github.io/Veracity/api/records-latest.json" > /dev/null || true

      - name: Commit & Push Verified Ledger
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull origin main --rebase
          git add public/api/
          if ! git diff --staged --quiet; then
            git commit -m "chore(ledger): autonomous audit & primary dossiers update [skip ci]"
            git push origin main
          else
            echo "No mutations detected. Ledger is fully synchronized and healthy."
          fi
