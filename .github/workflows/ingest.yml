name: Veracity Autonomous Ingestion & Keyless Signature

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# 賦予寫入倉庫與 Sigstore OIDC 簽章權限
permissions:
  contents: write
  id-token: write

jobs:
  ingest-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hardened Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run Hermetic Unit Tests
        run: python -m pytest tests/

      - name: Execute Autonomous Ingestion
        run: python -m scripts.ingest

      - name: Gatekeeper Enforce Schema Compliance
        run: make check-schema

      - name: Setup Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Keyless Cryptographic Signing
        run: |
          cosign sign-blob --yes \
            --bundle public/api/records-latest.json.bundle \
            public/api/records-latest.json

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py requirements requirements.lock --output-format json --output-file public/api/bom.json

      - name: Non-blocking Wayback Archive Snapshot
        continue-on-error: true
        run: |
          curl -s -X POST "https://web.archive.org/save/https://jackylawck.github.io/Veracity/api/records-latest.json" > /dev/null || true

      - name: Commit & Push Verified Ledger
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/api/
          git status
          if ! git diff --staged --quiet; then
            git commit -m "chore(ledger): ingest verified primary dossiers [skip ci]"
            git push origin main
          else
            echo "No mutations detected. Ledger up to date."
          fi
