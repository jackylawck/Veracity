<!DOCTYPE html>
<html lang="zh-HK" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>🛡️ Veritas 揭偽 | 主權級防偽與威脅情報帳本 (Sovereign Fraud Intelligence)</title>
  
  <meta name="description" content="Veritas (揭偽) 是一個企業級、開源、雙語的跨國主權防偽威脅情報鏡像帳本。即時匯聚香港金管局 (HKMA)、香港證監會 (SFC)、新加坡金管局 (MAS) 等全球法定機構公報。">
  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />
  
  <link rel="icon" type="image/png" sizes="192x192" href="Veritas192icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #121824;
      --border: #1e293b;
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --tag-bg: #1e293b;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 2rem 1.5rem;
      max-width: 1040px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
    .nav-logo { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 0.5rem; }
    .nav-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    .lang-btn { background: #1e293b; border: 1px solid var(--border); color: var(--accent); padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .lang-btn:hover { background: #334155; }
    .github-link { color: var(--text-muted); text-decoration: none; font-size: 1.2rem; }
    .github-link:hover { color: var(--text-main); }

    .hero { text-align: center; margin-bottom: 2.5rem; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.6rem; color: #ffffff; }
    .hero p { color: var(--text-muted); font-size: 1rem; max-width: 600px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem 1rem; text-align: center; }
    .stat-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem; }
    .stat-value { font-size: 1.8rem; font-weight: 800; }
    .stat-blue { color: var(--accent); }
    .stat-yellow { color: var(--warning); }
    .stat-green { color: var(--success); }
    .stat-date { color: #e2e8f0; font-size: 1.1rem; padding-top: 0.4rem; }

    .control-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem; }
    .timeline-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; color: #f1f5f9; }
    .tab-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover, .tab-btn.active { background: #1e293b; color: var(--text-main); border-color: var(--accent); }

    /* 🔍 搜尋框樣式 */
    .search-container { margin-bottom: 2rem; }
    .search-box { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1.2rem; color: var(--text-main); font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-box:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    .search-box::placeholder { color: #64748b; }

    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before { content: ""; position: absolute; left: 6px; top: 15px; bottom: 15px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; margin-bottom: 1.5rem; }
    .timeline-item::after { content: ""; position: absolute; left: -2rem; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.4rem; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { border-color: #334155; transform: translateY(-2px); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .badge-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .type-pill { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .time-stamp { font-size: 0.75rem; color: var(--text-muted); font-family: ui-monospace, monospace; }
    .meta-code { font-size: 0.7rem; color: #64748b; font-family: ui-monospace, monospace; }
    .sig-badge { font-size: 0.7rem; color: var(--success); background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 4px; padding: 1px 6px; }

    .card h2 { font-size: 1.05rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.25rem; line-height: 1.4; }
    .card-sub { font-size: 0.85rem; color: #94a3b8; font-style: italic; margin-bottom: 0.8rem; }
    
    .ioc-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.8rem; margin-bottom: 1rem; font-family: ui-monospace, monospace; font-size: 0.85rem; color: #fb7185; word-break: break-all; }
    .ioc-tag { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-right: 0.5rem; }

    .card-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .tag-cloud { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag-chip { font-size: 0.75rem; background: var(--tag-bg); color: #94a3b8; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .ext-link { font-size: 0.8rem; color: var(--accent); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }
    .ext-link:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .timeline { padding-left: 1.5rem; }
      .timeline-item::after { left: -1.5rem; }
    }
  </style>
  <script src="i18n.js"></script>
</head>
<body>

  <header class="nav-bar">
    <div class="nav-logo">
      <span>VERITAS</span>
      <span>|</span>
      <span id="ui-title">揭偽</span>
      <span class="nav-badge">TIER-1 AUDIT GRADE</span>
    </div>
    <div class="nav-actions">
      <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">Switch to English</button>
      <a class="github-link" href="https://github.com/jackylawck/Veritas" target="_blank" rel="noopener noreferrer">⚡</a>
    </div>
  </header>

  <section class="hero">
    <h1 id="hero-title">全球防偽與主權情報追蹤器</h1>
    <p id="hero-desc">追蹤全球主權監管機構與防詐公報結構化帳本。去個資化、可機讀、遵循 OASIS STIX 2.1 標準。</p>
  </section>

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-title" id="stat-lbl-1">官方總情報卷宗</div>
      <div class="stat-value stat-blue" id="kpi-total">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-title" id="stat-lbl-2">失陷指標 (IoC)</div>
      <div class="stat-value stat-yellow" id="kpi-ioc">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-title" id="stat-lbl-3">涵蓋主權法域</div>
      <div class="stat-value stat-green" id="kpi-sources">20+</div>
    </div>
    <div class="stat-card">
      <div class="stat-title" id="stat-lbl-4">最後審計時間</div>
      <div class="stat-value stat-date" id="kpi-audit-date">2026-09-24</div>
    </div>
  </section>

  <div class="control-header">
    <div class="timeline-title">
      <span>⚡</span>
      <span id="timeline-heading">全球主權防詐解密時間線</span>
    </div>
    <div class="tab-group" id="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('ALL')">全部 ALL</button>
      <button class="tab-btn" onclick="setFilter('BANK')">銀行冒名 BANK</button>
      <button class="tab-btn" onclick="setFilter('UNLICENSED')">無牌金融 UNLICENSED</button>
      <button class="tab-btn" onclick="setFilter('PHISHING')">釣魚網絡 PHISH</button>
      <button class="tab-btn" onclick="setFilter('SANCTION')">制裁名單 SDN</button>
    </div>
  </div>

  <!-- 🔍 搜尋輸入框 -->
  <div class="search-container">
    <input type="text" id="search-input" class="search-box" placeholder="🔍 搜尋卷宗 ID、機構、失陷網域（如 HSBC, Roblox, Binance, FTX）..." oninput="handleFilterAndSearch()">
  </div>

  <main class="timeline" id="timeline-list">
    <div style="color: #64748b; padding: 2rem 0; text-align: center;">情報帳本同步中...</div>
  </main>

  <footer style="margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: #64748b; text-align: center;">
    <div>Veritas Project · Sovereign Anti-Fraud Threat Intelligence Mirror</div>
    <div style="margin-top: 0.5rem;">
      <a href="https://github.com/jackylawck/Veritas/blob/main/LEGAL_COMPLIANCE.md" target="_blank" rel="noopener noreferrer" style="color: var(--accent); margin: 0 0.5rem; text-decoration: none;">⚖️ Legal & AI Compliance</a>
      <span>·</span>
      <a href="api/bundle-latest.json" target="_blank" style="color: var(--accent); margin: 0 0.5rem; text-decoration: none;">📦 Raw STIX 2.1 Feed</a>
    </div>
  </footer>

  <script>
    let currentLang = localStorage.getItem('veritas_lang') || 'zh';
    let cachedBundle = null;
    let allReports = [];
    let indicatorMap = {};
    let activeFilter = 'ALL';

    function cleanPattern(pattern) {
      if (!pattern) return '';
      const match = pattern.match(/=\s*['"]([^'"]+)['"]/);
      return match ? match[1] : pattern;
    }

    function detectCategory(reportName, desc) {
      const text = `${reportName} ${desc}`.toLowerCase();
      if (text.includes('bank') || text.includes('banking') || text.includes('hsbc') || text.includes('hkma')) return 'BANK';
      if (text.includes('unlicensed') || text.includes('sfc') || text.includes('mas') || text.includes('warning') || text.includes('cftc')) return 'UNLICENSED';
      if (text.includes('phish') || text.includes('openphish') || text.includes('roblox')) return 'PHISHING';
      if (text.includes('sanction') || text.includes('ofac') || text.includes('sdn')) return 'SANCTION';
      return 'UNLICENSED';
    }

    function setFilter(cat) {
      activeFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat));
      });
      handleFilterAndSearch();
    }

    function handleFilterAndSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allReports.filter(r => {
        const cat = detectCategory(r.name, r.description || '');
        const matchCategory = (activeFilter === 'ALL' || cat === activeFilter);

        if (!matchCategory) return false;
        if (!query) return true;

        const titleMatch = (r.name || '').toLowerCase().includes(query);
        const descMatch = (r.description || '').toLowerCase().includes(query);
        const iocMatch = (r.object_refs || []).some(id => {
          const pat = indicatorMap[id] || '';
          return pat.toLowerCase().includes(query);
        });
        return titleMatch || descMatch || iocMatch;
      });

      renderTimeline(filtered);
    }

    function renderTimeline(reports) {
      const container = document.getElementById('timeline-list');
      container.innerHTML = '';

      if (reports.length === 0) {
        container.innerHTML = `<div style="color: #64748b; padding: 2.5rem 0; text-align: center;">查無符合搜尋或篩選條件的主權情報卷宗。</div>`;
        return;
      }

      reports.forEach(r => {
        const item = document.createElement('div');
        item.className = 'timeline-item';

        const rawPatterns = (r.object_refs || []).map(id => indicatorMap[id]).filter(Boolean);
        const displayPatterns = rawPatterns.map(cleanPattern).join(' | ');
        const tooltip = rawPatterns.join('\n');
        const cat = detectCategory(r.name, r.description || '');
        const shortHash = (r.id.split('--')[1] || '').slice(0, 10);

        item.innerHTML = `
          <div class="card">
            <div class="card-top">
              <div class="badge-wrap">
                <span class="type-pill">${cat}</span>
                <span class="time-stamp">${(r.published || '').slice(0, 10)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:0.5rem;">
                <span class="sig-badge">🛡️ ${shortHash}...</span>
                <span class="meta-code">STIX 2.1</span>
              </div>
            </div>
            <h2>${r.name}</h2>
            <div class="card-sub">${r.description ? r.description.slice(0, 120) + '...' : 'Sovereign statutory alert issued by national regulator.'}</div>
            
            <div class="ioc-box">
              <span class="ioc-tag">失陷指標 (IoC)</span>
              <span title="${tooltip}">${displayPatterns || '無實體網域'}</span>
            </div>

            <div class="card-bottom">
              <div class="tag-cloud">
                <span class="tag-chip">置信度 ${r.confidence || 95}%</span>
                <span class="tag-chip">Zero-PII</span>
                <span class="tag-chip">RFC 4122</span>
              </div>
              ${r.external_references && r.external_references[0] 
                ? `<a class="ext-link" href="${r.external_references[0].url}" target="_blank" rel="noopener noreferrer">官方原始文檔 ↗</a>` 
                : ''}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('veritas_lang', currentLang);
      applyLocale();
    }

    function applyLocale() {
      const isEn = currentLang === 'en';
      document.getElementById('lang-toggle').textContent = isEn ? '切換為繁體中文' : 'Switch to English';
      document.getElementById('hero-title').textContent = isEn ? 'Global Sovereign Fraud & Impersonation Tracker' : '全球防偽與主權情報追蹤器';
      document.getElementById('hero-desc').textContent = isEn ? 'Real-time ledger of statutory alerts mirroring global regulators. Machine-readable STIX 2.1.' : '追蹤全球主權監管機構與防詐公報結構化帳本。去個資化、可機讀、遵循 OASIS STIX 2.1 標準。';
      document.getElementById('stat-lbl-1').textContent = isEn ? 'TOTAL INTELLIGENCE' : '官方總情報卷宗';
      document.getElementById('stat-lbl-2').textContent = isEn ? 'INDICATORS (IOC)' : '失陷指標 (IoC)';
      document.getElementById('stat-lbl-3').textContent = isEn ? 'JURISDICTIONS' : '涵蓋主權法域';
      document.getElementById('stat-lbl-4').textContent = isEn ? 'AUDIT EPOCH' : '最後審計時間';
      document.getElementById('timeline-heading').textContent = isEn ? 'Sovereign Disclosure Timeline' : '全球主權防詐解密時間線';
      document.getElementById('search-input').placeholder = isEn ? '🔍 Search dossier ID, bank, domain (e.g. HSBC, Roblox)...' : '🔍 搜尋卷宗 ID、機構、失陷網域（如 HSBC, Roblox, Binance, FTX）...';
      handleFilterAndSearch();
    }

    // 初次載入
    fetch('api/bundle-latest.json')
      .then(res => res.json())
      .then(data => {
        cachedBundle = data;
        allReports = data.objects.filter(o => o.type === 'report');
        const indicators = data.objects.filter(o => o.type === 'indicator');
        indicatorMap = Object.fromEntries(indicators.map(i => [i.id, i.pattern]));

        document.getElementById('kpi-total').textContent = allReports.length;
        document.getElementById('kpi-ioc').textContent = indicators.length;
        
        applyLocale();
      })
      .catch(() => {
        document.getElementById('timeline-list').innerHTML = `<div style="color:#fb7185; text-align:center;">情報端點加載逾時，請檢查 bundle-latest.json。</div>`;
      });
  </script>
</body>
</html>
